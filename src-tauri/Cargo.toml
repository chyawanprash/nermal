[package]
name = "nermal"
version = "0.1.0"
description = "nermal — a local-first, encrypted notes vault"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nermal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nermal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# vault crypto
argon2 = "0.5"
aes-gcm = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
