[package]
name = "nermalist"
version = "0.1.0"
description = "nermal — a local-first, encrypted notes vault"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nermal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nermalist"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
thiserror = "2"

# vault storage format
vault-compression = { path = "../crates/vault-compression" }

# timestamps & ids
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# vault crypto
argon2 = "0.5"
aes-gcm = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
